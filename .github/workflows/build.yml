name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows desktop and CLI
    runs-on: windows-latest
    permissions:
      checks: write
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $cargoMatch = [regex]::Match(
            (Get-Content "Cargo.toml" -Raw),
            '(?m)^version = "([^"]+)"\r?$'
          )
          $cargoVersion = $cargoMatch.Groups[1].Value
          $tauriVersion = (Get-Content "app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content "app/package.json" -Raw | ConvertFrom-Json).version

          if (-not $cargoVersion) {
            throw "Could not read the workspace version from Cargo.toml"
          }

          foreach ($entry in @{
            "tag" = $tagVersion
            "Cargo.toml" = $cargoVersion
            "tauri.conf.json" = $tauriVersion
            "package.json" = $packageVersion
          }.GetEnumerator()) {
            if ($entry.Value -ne $tagVersion) {
              throw "$($entry.Key) version '$($entry.Value)' does not match tag version '$tagVersion'"
            }
          }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test frontend
        working-directory: app
        run: pnpm test

      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: Build CLI
        run: cargo build -p sonar-cli --release

      - name: Build desktop app
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONARNWORK_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONARNWORK_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Package Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "target/release/sonarnwork-portable"
          $assets = "target/release/release-assets"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF_NAME
          } else {
            "ci-$env:GITHUB_RUN_NUMBER-$shortSha"
          }
          $zip = "$assets/SonarNwork-$version-windows-x64-portable.zip"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $assets -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path $assets | Out-Null

          Copy-Item "target/release/sonar.exe" $stage
          Copy-Item "target/release/sonarnwork.exe" $stage
          Copy-Item "target/release/sonarnwork-app.exe" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          Copy-Item `
            "target/release/sonar.exe" `
            "$assets/SonarNwork-CLI-$version-windows-x64.exe"

          Get-ChildItem "target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" } |
            Copy-Item -Destination $assets

          $checksums = Get-ChildItem $assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content "$assets/SHA256SUMS.txt" -Encoding ascii

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: target/release/release-assets/*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonarnwork-windows-x64
          if-no-files-found: error
          path: |
            target/release/release-assets/*
            !target/release/release-assets/SHA256SUMS.txt

  linux:
    name: Linux desktop and CLI
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test frontend
        working-directory: app
        run: pnpm test

      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: Build CLI
        run: cargo build -p sonar-cli --release

      - name: Build Debian desktop package
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONARNWORK_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONARNWORK_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb

      - name: Package Linux release assets
        shell: bash
        run: |
          set -euo pipefail
          assets="target/release/release-assets"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            version="0.0.0+ci.${GITHUB_RUN_NUMBER}"
          fi
          desktop_deb="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"

          test -n "$desktop_deb"
          rm -rf "$assets"
          mkdir -p "$assets"
          cp "$desktop_deb" "$assets/SonarNwork-${version}-linux-x64.deb"

          stage="$(mktemp -d)"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          sed "s/@VERSION@/${version}/" packaging/debian/sonarnwork-cli/control > "$stage/DEBIAN/control"
          install -m 0755 target/release/sonar "$stage/usr/bin/sonar"
          ln -s sonar "$stage/usr/bin/sonarnwork"
          dpkg-deb --root-owner-group --build "$stage" "$assets/SonarNwork-CLI-${version}-linux-x64.deb"
          rm -rf "$stage"

          tar -C target/release -czf "$assets/SonarNwork-CLI-${version}-linux-x64.tar.gz" sonar sonarnwork

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: target/release/release-assets/*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonarnwork-linux-x64
          if-no-files-found: error
          path: target/release/release-assets/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonarnwork-windows-x64
          path: release-assets

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonarnwork-linux-x64
          path: release-assets

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs -r sha256sum) \
            > release-assets/SHA256SUMS.txt

      - name: Publish release from existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "SonarNwork $GITHUB_REF_NAME" \
            "${prerelease[@]}"
