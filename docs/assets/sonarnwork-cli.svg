<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">SonarNwork colored command-line interface</title>
  <desc id="desc">A SonarNwork terminal session showing the interactive banner and a successful entity probe.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f4f1ec" />
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="1140" height="590" rx="18" fill="#0b1220" stroke="#253248" stroke-width="2" />
    <path d="M48 30h1104a18 18 0 0 1 18 18v44H30V48a18 18 0 0 1 18-18z" fill="#111a2b" />
  </g>

  <circle cx="62" cy="61" r="7" fill="#fb7185" />
  <circle cx="86" cy="61" r="7" fill="#fbbf24" />
  <circle cx="110" cy="61" r="7" fill="#4ade80" />
  <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">SonarNwork CLI — PowerShell</text>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="15.5" xml:space="preserve">
    <g fill="#22d3ee" font-weight="700">
      <text x="62" y="126">  ____   ___  _   _    _    ____  _   ___        _____  ____  _  __</text>
      <text x="62" y="148"> / ___| / _ \| \ | |  / \  |  _ \| \ | \ \      / / _ \|  _ \| |/ /</text>
      <text x="62" y="170"> \___ \| | | |  \| | / _ \ | |_) |  \| |\ \ /\ / / | | | |_) | ' /</text>
      <text x="62" y="192">  ___) | |_| | |\  |/ ___ \|  _ &lt;| |\  | \ V  V /| |_| |  _ &lt;| . \</text>
      <text x="62" y="214"> |____/ \___/|_| \_/_/   \_\_| \_\_| \_|  \_/\_/  \___/|_| \_\_|\_\</text>
    </g>

    <text x="62" y="250" fill="#f8fafc" font-weight="700">SonarNwork CLI Shell</text>
    <text x="278" y="250" fill="#94a3b8">0.1.0</text>
    <text x="62" y="274" fill="#94a3b8">CLI and Tauri app share this core API.</text>

    <text x="62" y="314" fill="#22d3ee">Mode   :</text>
    <text x="146" y="314" fill="#e2e8f0">interactive operator console</text>
    <text x="62" y="338" fill="#22d3ee">Scope  :</text>
    <text x="146" y="338" fill="#e2e8f0">local checks, DNS, trace, ports, probes, and scanners</text>
    <text x="62" y="362" fill="#22d3ee">Input  :</text>
    <text x="146" y="362" fill="#e2e8f0">type commands below without the program name</text>
    <text x="62" y="386" fill="#22d3ee">Try    :</text>
    <text x="146" y="386" fill="#fbbf24">help | probe list | myip | exit</text>

    <text x="62" y="434" fill="#22d3ee" font-weight="700">sonarnwork</text>
    <text x="164" y="434" fill="#94a3b8">&gt;</text>
    <text x="184" y="434" fill="#fbbf24">probe run core.describe_entity 1.1.1.1</text>

    <text x="62" y="470" fill="#4ade80" font-weight="700">ip normalized as ip:1.1.1.1</text>
    <text x="62" y="504" fill="#f8fafc" font-weight="700">Details</text>
    <text x="78" y="532" fill="#22d3ee">Type</text>
    <text x="150" y="532" fill="#64748b">:</text>
    <text x="170" y="532" fill="#e2e8f0">ip</text>
    <text x="78" y="558" fill="#22d3ee">Entity</text>
    <text x="150" y="558" fill="#64748b">:</text>
    <text x="170" y="558" fill="#e2e8f0">ip:1.1.1.1</text>

    <text x="62" y="596" fill="#22d3ee" font-weight="700">sonarnwork</text>
    <text x="164" y="596" fill="#94a3b8">&gt;</text>
    <rect x="184" y="581" width="9" height="19" rx="1" fill="#22d3ee" opacity="0.9" />
  </g>
</svg>
