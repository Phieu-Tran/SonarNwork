[workspace]
resolver = "2"
members = [
    "crates/sonar-core",
    "crates/sonar-os",
    "crates/sonar-tools",
    "crates/sonar-report",
    "crates/sonar-cli",
    "app/src-tauri",
]
default-members = ["crates/sonar-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
